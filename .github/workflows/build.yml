name: Сборка прошивок

on:
  push:
    branches: [main]
    paths: ['patches/**', 'scripts/**', 'platformio.releases.ini', '.github/workflows/build.yml']
  pull_request:
    paths: ['patches/**', 'scripts/**', 'platformio.releases.ini', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Heltec V4 OLED и FakeTec V4
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Установка PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Проверка консоли и сборка
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meshcore-firmware
          path: dist/
          if-no-files-found: error
